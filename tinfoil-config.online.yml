cvm-version: "0.14.12"
cpus: 2
memory: 8192
attested-keys:
  - id: job-signing
    key: ed25519
networks:
  internal:
    egress: closed
  internet:
    egress: open
containers:
  - name: signer
    image: ghcr.io/ekrembal/tinfoil-experiments@sha256:70e6939b00a6fba19d80cbbbe19a18195454663ecae138ba788116ef60d7581d
    command: ["node", "harness/start.mjs"]
    keys: [job-signing]
    attestation: true
    networks: [internal]
    tmpfs:
      /tmp: "rw,noexec,size=4096"
      /data: "rw,noexec"
      /workspaces: "rw,noexec"
      /root: "rw,noexec,size=4096"
    env:
      - HARNESS_IMAGE_DIGEST: "sha256:70e6939b00a6fba19d80cbbbe19a18195454663ecae138ba788116ef60d7581d"
      - CONFIG_REPO: "ekrembal/tinfoil-experiments"
      - APP_PROFILE: "online"
      - MAX_ARCHIVE_BYTES: "67108864"
      - MAX_JOB_BODY_BYTES: "94371840"
      - MODEL: "deepseek-v4-1-flash"
      - JOB_TIMEOUT_SECONDS: "900"
      - HOME: "/root"
      - SIGNER_BIND_ADDRESS: "172.31.255.2"
      - WORKER_URL: "http://worker:8081"
    secrets:
      - JOBS_BEARER_TOKEN
  - name: worker
    image: ghcr.io/ekrembal/tinfoil-experiments@sha256:70e6939b00a6fba19d80cbbbe19a18195454663ecae138ba788116ef60d7581d
    command: ["node", "harness/worker-start.mjs"]
    networks: [internet, internal]
    tmpfs:
      /tmp: "rw,noexec,size=4096"
      /data: "rw,noexec"
      /workspaces: "rw,exec"
      /root: "rw,noexec,size=4096"
    env:
      - APP_PROFILE: "online"
      - MAX_ARCHIVE_BYTES: "67108864"
      - MAX_JOB_BODY_BYTES: "94371840"
      - MODEL: "deepseek-v4-1-flash"
      - JOB_TIMEOUT_SECONDS: "900"
      - HOME: "/root"
      - SIGNER_HOST: "signer"
    secrets:
      - TINFOIL_API_KEY
shim:
  upstream-container: signer
  upstream-port: 8080
  paths: ["/jobs", "/jobs/*"]
