name: Online Profile Sync

on:
  push:
    branches: [profile/online, "devin/*-online-open-egress"]
    paths:
      - tinfoil-config.yml
      - tinfoil-config.online.yml
      - .github/workflows/profile-sync.yml
      - harness/check-online-config.mjs
  pull_request:
    branches: [profile/online]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: npm ci --ignore-scripts
      - name: Check online profile consistency and isolation
        run: node harness/check-online-config.mjs
