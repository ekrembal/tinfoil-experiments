cvm-version: "0.14.10"
cpus: 2
memory: 8192
networks:
  internal:
    egress: closed
containers:
  - name: signer
    image: ghcr.io/ekrembal/tinfoil-experiments@sha256:1a4961d1533f578639eafffd672444bd91c0869c98898b3ecb5cdbca68cb7031
    command: ["node", "harness/start.mjs"]
    networks: [internal]
    tmpfs:
      /tmp: "rw,noexec,size=4096"
      /data: "rw,noexec,size=1m"
      /workspaces: "rw,noexec,size=1m"
      /root: "rw,noexec,size=4096"
    env:
      - DEV_MODE: "1"
      - HARNESS_IMAGE_DIGEST: "sha256:1a4961d1533f578639eafffd672444bd91c0869c98898b3ecb5cdbca68cb7031"
      - CONFIG_REPO: "ekrembal/tinfoil-experiments"
      - MODEL: "deepseek-v4-1-flash"
      - JOB_TIMEOUT_SECONDS: "900"
      - HOME: "/root"
      - SIGNER_BIND_ADDRESS: "172.31.255.2"
      - WORKER_URL: "http://worker:8081"
    secrets:
      - JOBS_BEARER_TOKEN
shim:
  upstream-container: signer
  upstream-port: 8080
  paths: ["/jobs", "/jobs/*"]
